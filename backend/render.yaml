services:
  - type: web
    name: carechain-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: REDIS_URL
        value: ""
      - key: FRONTEND_URL
        value: "https://frontend-seven-pi-24.vercel.app"
      - key: ALLOWED_ORIGINS
        value: '["https://frontend-seven-pi-24.vercel.app","http://localhost:5173"]'
      - key: DEBUG
        value: "false"
